{{ define "users.html" }}

<body>
<div class="container-lg mt-4">
  <div class="row">
    <div class="col-lg-7 mb-4">
      <div class="card border-primary">
        <div class="card-header">Users</div>
        <div class="card-body">
          {{ if .Users }}
          <div class="accordion" id="usersAcc">
            {{ range .Users }}
            <div class="accordion-item">
              <h2 class="accordion-header">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#user{{ .ID }}" aria-expanded="false">
                  <span style="display:inline-block;width:1em;height:1em;border-radius:50%;background-color:{{ .Color }};margin-right:0.5em;border:1px solid #888"></span>
                  {{ .Name }}
                  {{ if eq .ID $.CurrentUser.ID }}<span class="badge bg-primary ms-2">current</span>{{ end }}
                  {{ if .Sex }}<span class="badge bg-secondary ms-2">{{ .Sex }}</span>{{ end }}
                  {{ if .DOB }}<small class="text-muted ms-2">DOB {{ .DOB }}</small>{{ end }}
                </button>
              </h2>
              <div id="user{{ .ID }}" class="accordion-collapse collapse">
                <div class="accordion-body">
                  <form action="/users/" method="post">
                    <input type="hidden" name="id" value="{{ .ID }}">
                    <div class="row g-3">
                      <div class="col-md-6">
                        <label class="form-label">Name</label>
                        <input name="name" type="text" class="form-control" value="{{ .Name }}" required maxlength="40">
                      </div>
                      <div class="col-md-6">
                        <label class="form-label">Color</label>
                        <input name="color" type="color" class="form-control form-control-color" value="{{ .Color }}">
                      </div>
                      <div class="col-md-4">
                        <label class="form-label">Sex (for PRT)</label>
                        <select name="sex" class="form-select">
                          <option value=""  {{ if eq .Sex "" }}selected{{ end }}>—</option>
                          <option value="M" {{ if eq .Sex "M" }}selected{{ end }}>Male</option>
                          <option value="F" {{ if eq .Sex "F" }}selected{{ end }}>Female</option>
                        </select>
                      </div>
                      <div class="col-md-4">
                        <label class="form-label">Date of birth</label>
                        <input name="dob" type="date" class="form-control" value="{{ .DOB }}">
                      </div>
                      <div class="col-md-4">
                        <label class="form-label">Altitude</label>
                        <select name="altitude" class="form-select">
                          <option value="low"  {{ if eq .Altitude "low" }}selected{{ end }}>&lt;5000 ft</option>
                          <option value="high" {{ if eq .Altitude "high" }}selected{{ end }}>≥5000 ft</option>
                        </select>
                      </div>
                    </div>
                    <div class="mt-3 d-flex justify-content-between">
                      <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                  </form>
                  <form action="/userdel/" method="post" onsubmit="return confirm('Delete user {{ .Name }}? Only works if they have no workouts or weight history.');" class="mt-2">
                    <input type="hidden" name="id" value="{{ .ID }}">
                    <button type="submit" class="btn btn-sm btn-outline-danger">
                      <i class="bi bi-trash"></i> Delete user (only if no history)
                    </button>
                  </form>
                </div>
              </div>
            </div>
            {{ end }}
          </div>
          {{ else }}
          <p class="text-muted mb-0">No users yet. Add one →</p>
          {{ end }}
        </div>
      </div>
    </div>

    <div class="col-lg-5 mb-4">
      <div class="card border-primary">
        <div class="card-header">Add user</div>
        <div class="card-body">
          <form action="/users/" method="post">
            <input type="hidden" name="id" value="">
            <div class="mb-3">
              <label class="form-label">Name</label>
              <input name="name" type="text" class="form-control" required maxlength="40">
            </div>
            <div class="mb-3">
              <label class="form-label">Color</label>
              <input name="color" type="color" class="form-control form-control-color" value="#0d6efd">
            </div>
            <div class="mb-3">
              <label class="form-label">Sex (for PRT scoring)</label>
              <select name="sex" class="form-select">
                <option value="">—</option>
                <option value="M">Male</option>
                <option value="F">Female</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Date of birth (for PRT age bracket)</label>
              <input name="dob" type="date" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">Altitude</label>
              <select name="altitude" class="form-select">
                <option value="low" selected>&lt;5000 ft</option>
                <option value="high">≥5000 ft</option>
              </select>
              <div class="form-text">Only matters for PRT cardio scoring.</div>
            </div>
            <button type="submit" class="btn btn-primary">Add</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

{{ template "footer.html" }}
{{ end }}
